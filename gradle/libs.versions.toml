[versions]
# Build tools
agp = "9.3.2"
kotlin = "2.4.10"
lsparanoid = "0.6.0"
autoService = "1.1.1"

# AndroidX
annotation = "1.10.0"
core = "1.19.0"

# Xposed & Hooks
xposed-api = "102.0.0"
xposed-service = "102.0.0"
ezhooktool = "1.1.3"

[libraries]
# AndroidX
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
core = { module = "androidx.core:core", version.ref = "core" }

# Xposed & Hooks
ezhooktool-core = { module = "io.github.lingqiqi5211.ezhooktool:core", version.ref = "ezhooktool" }
ezhooktool-xposed102 = { module = "io.github.lingqiqi5211.ezhooktool:hook-xposed-102", version.ref = "ezhooktool" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "xposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "xposed-service" }

# Third-party
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "autoService" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
lsparanoid = { id = "org.lsposed.lsparanoid", version.ref = "lsparanoid" }
