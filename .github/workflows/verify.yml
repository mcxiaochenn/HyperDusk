name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install bridge generator
        run: cargo install flutter_rust_bridge_codegen --version 2.14.0-beta.2 --locked

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify generated bindings
        run: |
          flutter_rust_bridge_codegen generate
          cd rust
          cargo fmt
          cd ..
          dart format lib test hook
          git diff --exit-code

      - name: Verify Rust core
        working-directory: rust
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Verify Flutter UI
        run: |
          flutter analyze
          flutter test --no-pub

      - name: Reject legacy source contamination
        shell: bash
        run: |
          if git grep -I -E 'com\.sevtinge\.hyperceiler|VolumeUpTorch|hyperdusk_volume_up_double_press_action|GNU AFFERO' -- . ':(exclude).github/workflows/verify.yml'; then
            echo 'Legacy source contamination detected.' >&2
            exit 1
          fi

      - name: Build debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64

      - name: Audit APK
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -l "$apk" | grep 'META-INF/xposed/java_init.list'
          unzip -l "$apk" | grep 'META-INF/xposed/module.prop'
          unzip -l "$apk" | grep 'META-INF/xposed/scope.list'
          unzip -l "$apk" | grep 'lib/arm64-v8a/libhyperdusk_core.so'
          unzip -l "$apk" | grep 'lib/x86_64/libhyperdusk_core.so'
          test -z "$(unzip -p "$apk" META-INF/xposed/scope.list | tr -d '\r\n[:space:]')"
          if unzip -p "$apk" classes.dex | strings | grep -E 'com\.sevtinge\.hyperceiler|VolumeUpTorch|hyperdusk_volume_up_double_press_action'; then
            echo 'Legacy symbol found in APK.' >&2
            exit 1
          fi
          sha256sum "$apk" | tee build/app/outputs/flutter-apk/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdusk-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS
