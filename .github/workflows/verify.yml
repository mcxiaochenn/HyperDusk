name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 固定签名证书指纹（SHA-256，小写、无冒号）。来源与重新生成方式见 .research/notes/signing.md。
  # 若这两个常量与实际签名不一致，下面的 Verify APK signing certificates 步骤会直接失败（防止签名漂移）。
  DEBUG_CERT_SHA256: cd87fd56c93a92b2cf8f781a743705821240adda3a8a845e0803b69461ce2c52
  RELEASE_CERT_SHA256: 6c94ac955a6167ca24aa67e671ad1105373f5966723e25cb2b4d0c937cbbadbf

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install bridge generator
        run: cargo install flutter_rust_bridge_codegen --version 2.14.0-beta.2 --locked

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify generated bindings
        run: |
          flutter_rust_bridge_codegen generate
          cd rust
          cargo fmt
          cd ..
          dart format lib test hook
          git diff --exit-code

      - name: Verify Rust core
        working-directory: rust
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Verify Flutter UI
        run: |
          flutter analyze
          flutter test --no-pub

      - name: Reject legacy source contamination
        shell: bash
        run: |
          if git grep -I -E 'com\.sevtinge\.hyperceiler|VolumeUpTorch|hyperdusk_volume_up_double_press_action|GNU AFFERO' -- . ':(exclude).github/workflows/verify.yml'; then
            echo 'Legacy source contamination detected.' >&2
            exit 1
          fi

      - name: Decode release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # release keystore 不进仓库：CI 从 GitHub Secrets 解码到 runner 临时目录，再通过环境变量交给 Gradle。
          # 未配置 secrets 时 release 构建退化为固定的 debug 签名（本地/CI 都能出包），签名校验按 debug 指纹检查。
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not configured; release APK will be signed with the fixed debug keystore."
            echo "EXPECTED_RELEASE_CERT_SHA256=$DEBUG_CERT_SHA256" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set but RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD is missing."
            exit 1
          fi
          keystore="$RUNNER_TEMP/hyperdusk-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "EXPECTED_RELEASE_CERT_SHA256=$RELEASE_CERT_SHA256"
          } >> "$GITHUB_ENV"
          echo "release keystore decoded: $(wc -c < "$keystore") bytes"

      - name: Build debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64

      - name: Build release APK
        run: flutter build apk --release --no-pub --target-platform android-arm64,android-x64

      - name: Verify APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools" >&2
            exit 1
          fi
          echo "using $apksigner"

          fingerprint() {
            # 注意：函数 stdout 只能输出一行 64 位小写 hex 指纹（调用方用 $(...) 捕获），
            # 所有诊断信息一律走 stderr（>&2），否则会污染 actual 变量。
            local apk="$1" out fp
            if ! out="$("$apksigner" verify --print-certs "$apk" 2>&1)"; then
              echo "::error::apksigner verify failed for $apk:" >&2
              printf '%s\n' "$out" >&2
              return 1
            fi
            # 诊断（stderr）：build-tools 37.0.0 的格式是
            #   "V2 Signer: certificate SHA-256 digest: <64 hex>"
            # （旧版是 "Signer #1 certificate SHA-256 digest: ..."），
            # 之前用 "^Signer #1 certificate ..." 锚定解析就会得到空值。
            echo "---- apksigner verify --print-certs $(basename "$apk") ----" >&2
            printf '%s\n' "$out" >&2
            echo "---- end apksigner output ----" >&2
            # 宽松解析：任意含 "SHA-256 digest" 的行，取第一条，去掉前缀/冒号/空白并统一小写。
            # 用 `sed -n '1p'` 而不是 `head -n1`：本步骤开了 `set -o pipefail`，head 提前关闭管道
            # 会让上游 grep 收到 SIGPIPE(141) 而被误判为失败；awk/sed 会读完整个输入，不会有这个问题。
            # 末尾 `|| true`：grep 无匹配时管道返回非 0，避免 `set -e` 直接退出、从而走到下面的明确报错。
            fp="$(printf '%s\n' "$out" \
              | grep -i 'SHA-256 digest' \
              | sed -n '1p' \
              | sed 's/.*digest: *//' \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]')" || true
            # 只接受 ^[0-9a-f]{64}$，其它（空值/多行/脏值/大写）一律视为解析失败
            if ! printf '%s' "$fp" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::could not parse a 64-hex SHA-256 fingerprint from apksigner output for $apk (see apksigner output above)" >&2
              return 1
            fi
            printf '%s\n' "$fp"
          }

          apk_dir=build/app/outputs/flutter-apk
          expected_debug="$(printf '%s' "$DEBUG_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_release="$(printf '%s' "${EXPECTED_RELEASE_CERT_SHA256:-$DEBUG_CERT_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          actual_debug="$(fingerprint "$apk_dir/app-debug.apk")"
          actual_release="$(fingerprint "$apk_dir/app-release.apk")"
          echo "debug   expected=$expected_debug   actual=$actual_debug"
          echo "release expected=$expected_release actual=$actual_release"

          status=0
          if [ -z "$actual_debug" ] || [ "$actual_debug" != "$expected_debug" ]; then
            echo "::error::debug APK signing certificate mismatch (signature drift!)." >&2
            status=1
          fi
          if [ -z "$actual_release" ] || [ "$actual_release" != "$expected_release" ]; then
            echo "::error::release APK signing certificate mismatch (signature drift!)." >&2
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "APK signing certificates verified."

      - name: Audit APK structure and scope
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=build/app/outputs/flutter-apk
          expected_scope="$(printf 'system\ncom.android.settings\ncom.android.systemui\ncom.miui.securitycore')"

          audit_apk() {
            local apk="$1" label="$2"
            echo "== auditing $label APK: $apk =="
            unzip -l "$apk" | grep 'META-INF/xposed/java_init.list'
            unzip -l "$apk" | grep 'META-INF/xposed/module.prop'
            unzip -l "$apk" | grep 'META-INF/xposed/scope.list'
            unzip -l "$apk" | grep 'lib/arm64-v8a/libhyperdusk_core.so'
            unzip -l "$apk" | grep 'lib/x86_64/libhyperdusk_core.so'
            local actual_scope
            actual_scope="$(unzip -p "$apk" META-INF/xposed/scope.list | tr -d '\r')"
            if [ "$actual_scope" != "$expected_scope" ]; then
              echo "Unexpected scope.list content in $label APK:" >&2
              printf '%s\n' "$actual_scope" >&2
              exit 1
            fi
            if unzip -p "$apk" 'classes*.dex' | strings | grep -E 'com\.sevtinge\.hyperceiler|VolumeUpTorch|hyperdusk_volume_up_double_press_action'; then
              echo "Legacy symbol found in $label APK." >&2
              exit 1
            fi
            # java_init.list 里的入口类必须真实存在于 dex（release 走 R8 混淆时靠
            # -adaptresourcefilecontents 把资源内容改成混淆后的类名；这里防止条目与 dex 脱节）
            local init_class init_descriptor dex ok
            init_class="$(unzip -p "$apk" META-INF/xposed/java_init.list | tr -d '\r' | awk 'NR==1 { print }')"
            if [ -z "$init_class" ]; then
              echo "Empty java_init.list in $label APK." >&2
              exit 1
            fi
            init_descriptor="L$(printf '%s' "$init_class" | tr '.' '/')"
            ok=0
            for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
              if unzip -p "$apk" "$dex" | strings | grep -F "$init_descriptor" >/dev/null; then
                ok=1
                break
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "java_init.list entry '$init_class' not found in $label APK dex files." >&2
              exit 1
            fi
          }

          audit_apk "$apk_dir/app-debug.apk" debug
          audit_apk "$apk_dir/app-release.apk" release

          sha256sum "$apk_dir/app-debug.apk" | tee "$apk_dir/SHA256SUMS"
          sha256sum "$apk_dir/app-release.apk" | tee "$apk_dir/SHA256SUMS-release"

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdusk-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdusk-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS-release

  release:
    # 打 tag（v*）时才发布。tag 推送会重新跑一遍 verify，构建 + 签名校验 + 结构审计全部通过后才到这一步。
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyperdusk-release
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS-release
          cd dist
          sha256sum app-release.apk > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: HyperDusk ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/SHA256SUMS
          body: |
            HyperDusk 的第一个公开版本：一个面向 **HyperOS 4.0 / Android 17（API 37）** 的独立 libxposed 模块，
            在系统设置「辅助功能 → 快捷手势」里扩展两项能力。

            ## 功能

            - **背部轻敲 → 手电筒**：给「轻敲两下 / 轻敲三下」的下拉列表增加「手电筒」选项，选中后敲击背部即可开关手电筒。
            - **快捷手势 → 双击音量上键**：在快捷手势列表新增一行，二级菜单与「双击电源键」完全一致；仅灭屏时触发，
              媒体播放 / 通话中不触发，触发前先唤醒屏幕。

            ## 安装

            1. 下载 `app-release.apk` 安装（固定 release 签名，后续版本可直接覆盖升级）。
            2. 在 LSPosed / Vector 中启用 HyperDusk；作用域由模块固定为四项（`system`、`com.android.settings`、
               `com.android.systemui`、`com.miui.securitycore`），无需手动勾选。
            3. 重启手机，让 `system_server` 与 `com.miui.securitycore` 重新注入。
            4. 打开系统设置 → 辅助功能 → 快捷手势，配置对应手势。

            ## 要求

            - HyperOS 4.0 / Android 17 真机；框架需实现 libxposed API 102，且支持 `system_server` 注入（`PROP_CAP_SYSTEM`）。
            - 模块 App 自身是状态页 / 设置页，不参与注入（libxposed API 101 起的既定行为）。

            ## 已知限制

            - 双击音量上键在灭屏触发时会同时留下两次正常音量步进（与系统「双击音量下极速相机」的既有行为一致）。
            - 背部轻敲 sensor 只在亮屏时由系统注册，灭屏时不会触发。
            - 国际版未适配（国际版「双击电源键」页会直接关闭，因此「双击音量上键」入口只在非国际版注入）。
            - 部分 Hook 依赖 securitycore 的内部实现（混淆名随系统升级可能变化），代码带运行时守卫，失效时降级不崩。

            ## 校验

            `SHA256SUMS` 为 `app-release.apk` 的 SHA-256。构建日志里同时输出 APK 签名证书指纹校验结果；
            签名漂移会让 CI 直接失败。

            完整改动见 [提交记录](https://github.com/mcxiaochenn/HyperDusk/commits/main)。
