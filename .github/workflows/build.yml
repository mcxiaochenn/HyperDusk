name: Build HyperDusk

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Run tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Generate SHA-256
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hyperdusk-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
