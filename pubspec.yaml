name: hyperdusk
description: HyperOS 4 gesture enhancement module built on Flutter and Rust.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_miuix: ^1.3.0
  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
